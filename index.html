<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ba'al Drop Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }

        .panel {
            background: rgba(30, 25, 55, 0.8);
            border: 2px solid rgba(138, 106, 255, 0.5);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(138, 106, 255, 0.5);
        }

        h3 {
            color: #b8a6ff;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(50, 40, 80, 0.8);
            border: 2px solid rgba(138, 106, 255, 0.5);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover, input[type="number"]:hover {
            border-color: rgba(138, 106, 255, 0.8);
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #8a6aff;
            box-shadow: 0 0 10px rgba(138, 106, 255, 0.5);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(50, 40, 80, 0.6);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-container:hover {
            background: rgba(70, 60, 100, 0.6);
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .boss-button {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(80, 60, 120, 0.8);
            border: 2px solid rgba(138, 106, 255, 0.5);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .boss-button:hover {
            background: rgba(100, 80, 140, 0.9);
            border-color: #8a6aff;
        }

        .boss-button.active {
            background: rgba(138, 106, 255, 0.8);
            border-color: #fff;
        }

        button.roll-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #8a6aff, #6a4adf);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(138, 106, 255, 0.4);
        }

        button.roll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 106, 255, 0.6);
        }

        button.roll-btn:active {
            transform: translateY(0);
        }

        .result-item {
            background: rgba(50, 40, 80, 0.6);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #8a6aff;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-item.legendary {
            border-left-color: #ffd700;
            background: rgba(80, 60, 40, 0.6);
        }

        .result-item.epic {
            border-left-color: #ff6ec7;
        }

        .result-item.rare {
            border-left-color: #4a9eff;
        }

        .drop-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .drop-count {
            font-size: 14px;
            color: #b8a6ff;
        }

        .no-results {
            text-align: center;
            color: #888;
            padding: 40px;
            font-style: italic;
        }

        .stats {
            background: rgba(50, 40, 80, 0.6);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .middle-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .version {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }

        .results-scroll {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .results-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .results-scroll::-webkit-scrollbar-track {
            background: rgba(50, 40, 80, 0.3);
            border-radius: 10px;
        }

        .results-scroll::-webkit-scrollbar-thumb {
            background: rgba(138, 106, 255, 0.5);
            border-radius: 10px;
        }

        .results-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(138, 106, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Settings -->
        <div class="panel">
            <h2>Settings</h2>
            
            <div class="setting-group">
                <h3>Drop Rate</h3>
                <div class="checkbox-container">
                    <input type="checkbox" id="x2Rate">
                    <label for="x2Rate">x2 Drop Rate</label>
                </div>
            </div>

            <div class="setting-group">
                <h3>Sélectionner Boss</h3>
                <button class="boss-button active" data-boss="resurrected">Resurrected Ba'al</button>
                <button class="boss-button" data-boss="truedemon">True Demon Ba'al</button>
            </div>
        </div>

        <!-- Middle Panel: Controls -->
        <div class="panel middle-panel">
            <div>
                <h2>Rolling Simulator</h2>
                
                <div class="setting-group">
                    <h3>Nombre de Kills</h3>
                    <input type="number" id="killCount" value="1" min="1" max="10000">
                </div>

                <button class="roll-btn" onclick="rollDrops()">ROLL</button>
                
                <div class="version">v1.1 - Ba'al Drop Simulator</div>
            </div>
        </div>

        <!-- Right Panel: Results -->
        <div class="panel">
            <h2>Results</h2>
            <div class="results-scroll" id="results">
                <div class="no-results">Appuie sur ROLL pour simuler des drops !</div>
            </div>
            <div class="stats" id="stats" style="display: none;">
                <div class="stat-line">
                    <span>Total Kills:</span>
                    <span id="totalKills">0</span>
                </div>
                <div class="stat-line">
                    <span>Total Drops:</span>
                    <span id="totalDrops">0</span>
                </div>
                <div class="stat-line">
                    <span>Drop Rate:</span>
                    <span id="dropRate">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const drops = {
            resurrected: [
                { name: "Hollow's Halberd", rate: 0.05, rarity: "epic" },
                { name: "Resurrected Ba'al's Outfit 2.0", rate: 0.05, rarity: "epic" },
                { name: "Resurrected Ba'al's Head", rate: 0.005, rarity: "legendary" }
            ],
            truedemon: [
                { name: "True Ba'al's Guard", rate: 0.02, rarity: "epic" },
                { name: "Hollow's Great Sword", rate: 0.02, rarity: "epic" },
                { name: "True Ba'al's Snake Head", rate: 0.05, rarity: "rare" },
                { name: "True Ba'al's Snake Fire", rate: 0.20, rarity: "rare" },
                { name: "True Ba'al's Horns", rate: 0.05, rarity: "rare" },
                { name: "Hollow's World Ender", rate: 0.01, rarity: "legendary" },
                { name: "Prestige World Ender", rate: 0.00001, rarity: "legendary" },
                { name: "Endbringer Wings", rate: 0.01, rarity: "legendary" },
                { name: "Endbringer Armor", rate: 0.01, rarity: "legendary" }
            ]
        };

        let selectedBoss = 'resurrected';
        let sessionDrops = {};
        let sessionKills = 0;

        // Boss selection
        document.querySelectorAll('.boss-button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.boss-button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedBoss = this.dataset.boss;
            });
        });

        function rollDrops() {
            const killCount = parseInt(document.getElementById('killCount').value) || 1;
            const x2Rate = document.getElementById('x2Rate').checked;
            const dropMultiplier = x2Rate ? 2 : 1;
            
            const currentDrops = drops[selectedBoss];
            const droppedItems = {};
            
            sessionKills += killCount;

            for (let i = 0; i < killCount; i++) {
                currentDrops.forEach(drop => {
                    const adjustedRate = Math.min(drop.rate * dropMultiplier, 1);
                    if (Math.random() < adjustedRate) {
                        droppedItems[drop.name] = (droppedItems[drop.name] || 0) + 1;
                        sessionDrops[drop.name] = (sessionDrops[drop.name] || 0) + 1;
                    }
                });
            }

            displayResults(droppedItems);
            updateStats();
        }

        function displayResults(droppedItems) {
            const resultsDiv = document.getElementById('results');
            
            if (Object.keys(droppedItems).length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">Aucun drop cette fois... Réessaye !</div>';
                return;
            }

            let html = '';
            const currentDrops = drops[selectedBoss];
            
            for (const [itemName, count] of Object.entries(droppedItems)) {
                const dropInfo = currentDrops.find(d => d.name === itemName);
                const rarity = dropInfo ? dropInfo.rarity : 'rare';
                
                html += `
                    <div class="result-item ${rarity}">
                        <div class="drop-name">${itemName}</div>
                        <div class="drop-count">x${count}</div>
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = html;
        }

        function updateStats() {
            document.getElementById('stats').style.display = 'block';
            document.getElementById('totalKills').textContent = sessionKills;
            
            const totalDrops = Object.values(sessionDrops).reduce((a, b) => a + b, 0);
            document.getElementById('totalDrops').textContent = totalDrops;
            
            const dropRate = sessionKills > 0 ? ((totalDrops / sessionKills) * 100).toFixed(2) : 0;
            document.getElementById('dropRate').textContent = dropRate + '%';
        }
    </script>
</body>
</html>
